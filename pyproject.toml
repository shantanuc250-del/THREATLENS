[project]
name = "threatlens-backend"
version = "1.0.0"
description = "ThreatLens Flask backend"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0",
    "Flask-Cors>=4.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "scipy>=1.11.0",
]

[tool.vercel]
entrypoint = "run:app"
