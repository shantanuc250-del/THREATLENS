    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var t = localStorage.getItem('threatlens.theme');
          var valid = ['midnight', 'obsidian', 'aurora', 'daylight'];
          if (!t || valid.indexOf(t) === -1) {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'daylight' : 'midnight';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
